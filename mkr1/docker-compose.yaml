name: plsql-mkr1
services:
  postgres:
    image: postgres:16
    container_name: postgres-mkr1
    restart: unless-stopped

    ports:
      - "5444:5432"

    environment:
      POSTGRES_DB: mkr1
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
